title: Zlatko Lakisic
description: Private Networks Architect & Practice Lead · Enterprise Presales & Connected Solutions
logo: /assets/profile.jpg
url: https://zlatko-lakisic.github.io
baseurl: /zlatko-lakisic
theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

show_downloads: false

github_username: zlatko-lakisic
google_analytics: G-0R57S4CBRC

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "White-Papers"
    values:
      layout: whitepaper

exclude:
  - Gemfile
  - Gemfile.lock
  - portfolio.code-workspace
  - README.profile.md
  - README.md
